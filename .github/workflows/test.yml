name: PortfolioLab CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run strategy tests
      run: |
        pytest test_strategies.py -v --tb=short
    
    - name: Run optimizer tests
      run: |
        pytest test_optimizer.py -v --tb=short
    
    - name: Run edge case tests
      run: |
        pytest test_edge_cases.py -v --tb=short
    
    - name: Run all tests with coverage
      run: |
        pytest test_*.py -v --cov=src --cov-report=term-missing
    
    - name: Check for import errors
      run: |
        python -c "from src.backtester import Backtester, Portfolio; from src.strategies import Strategies; from src.data_generator import create_sample_assets; print('All imports successful')"
    
    - name: Validate app startup
      run: |
        timeout 10 python app.py || true
